<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Red Thread</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        background: #0b0e14;
        border: 1px solid #27272a;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      }
      .mark {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #ef4444, #7f1d1d);
        box-shadow: 0 0 24px rgba(220, 38, 38, 0.45);
      }
      h1 {
        margin: 2px 0 0;
        color: #f5f5f5;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .sub {
        margin: 0;
        color: #ef4444;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .brand {
        margin-top: 10px;
        color: #6b7280;
        font-size: 11px;
        text-align: center;
      }
      .track {
        width: 220px;
        height: 3px;
        margin-top: 14px;
        background: #1f2937;
        border-radius: 999px;
        overflow: hidden;
      }
      .bar {
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, #991b1b, #ef4444);
        border-radius: 999px;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(340%); }
      }
      .status {
        margin-top: 10px;
        color: #9ca3af;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="card" data-tauri-drag-region>
      <div class="mark"></div>
      <h1>THE RED THREAD</h1>
      <p class="sub">El Hilo Rojo</p>
      <div class="track"><div class="bar"></div></div>
      <p class="status">Starting local AI engine and forensic backend…</p>
      <p class="brand">Alderson OSINT Group LLC</p>
    </div>
  </body>
</html>
